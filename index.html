<style>
:root{
  color-scheme: light dark;
  --ink:#16222C; --ink-soft:#4A5A66; --ink-faint:#7C8B96;
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F5F7F8;
  --line:#DCE3E7; --accent:#1F6F6B; --accent-soft:#E3EFEE; --gold:#B8862F;

  --font-head:"Amiri", serif;

  --fs:17px; --hs:1; --w:900px;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EDF2; --ink-soft:#A9B8C2; --ink-faint:#7E8F9B;
    --bg:#0E161D; --surface:#16212B; --surface-2:#1C2833;
    --line:#2A3945; --accent:#57C2B4; --accent-soft:#17312F; --gold:#D9AE5F;
    --danger:#E0715C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#E6EDF2; --ink-soft:#A9B8C2; --ink-faint:#7E8F9B;
  --bg:#0E161D; --surface:#16212B; --surface-2:#1C2833;

}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 86px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  font-size:var(--fs); line-height:1.85; -webkit-text-size-adjust:100%;

.navchips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:6px 14px; font-size:14px; white-space:nowrap; text-decoration:none;

/* ===== الأقسام ===== */

.block{position:relative}

<script>
/* =======================================================================
   1) أدوات مساعدة
   ======================================================================= */
const $  = (s,r=document)=>r.querySelector(s);
const uid = ()=> Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
 
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function setStatus(txt){ $('#status').textContent = txt; }
 
/* تجزئة كلمة المرور (SHA-256 عند التوفّر، وبديل بسيط عند العمل من ملف محلي) */
async function hashPass(pass){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('v1:'+pass));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381; const s='v1:'+pass;
    for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
    return 'fb'+h.toString(16);
  }
}
 
/* تنسيق نصّي مبسّط: **عريض** و*مائل* و`كود` و[نص](رابط) وقوائم تبدأ بـ - */
function fmt(text){
  const lines = String(text||'').split(/\n/);
  let out='', inList=false;
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|\W)\*(.+?)\*(?=\W|$)/g,'$1<em>$2</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(const line of lines){
    const t=line.trim();
    if(/^[-•]\s+/.test(t)){ if(!inList){out+='<ul>'; inList=true;} out+='<li>'+inline(t.replace(/^[-•]\s+/,''))+'</li>'; continue; }
    if(inList){ out+='</ul>'; inList=false; }
    if(t==='') { out+='<br>'; continue; }
    out += '<span>'+inline(t)+'</span><br>';
  }
  if(inList) out+='</ul>';
  return out;
}
 
/* استخراج مشغّل الفيديو من الرابط */
function videoEmbed(url){
  const u = String(url||'').trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(m) return `<iframe src="https://www.youtube-nocookie.com/embed/${esc(m[1])}" title="فيديو" allowfullscreen allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return `<iframe src="https://player.vimeo.com/video/${esc(m[1])}" title="فيديو" allowfullscreen></iframe>`;
  if(/^https?:\/\//.test(u)) return `<video src="${esc(u)}" controls playsinline preload="metadata"></video>`;
  return '<div style="display:grid;place-items:center;height:100%;color:#fff">رابط فيديو غير صالح</div>';
}
 
 
/* =======================================================================
   1.5) محرّك المظهر: الخطوط والألوان والمقاسات
   ======================================================================= */
const FONTS = ['IBM Plex Sans Arabic','Tajawal','Cairo','Almarai','Readex Pro','Noto Kufi Arabic','Changa','El Messiri','Reem Kufi','Amiri','Aref Ruqaa','Markazi Text','Rubik'];
const SERIF_FONTS = ['Amiri','Aref Ruqaa','Markazi Text'];
 
const VARS = {
  bg:['--bg','خلفية الصفحة'],
  surface:['--surface','خلفية البطاقات'],
  surface2:['--surface-2','خلفية ثانوية'],
  ink:['--ink','لون النص'],
  inkSoft:['--ink-soft','نص ثانوي'],
  line:['--line','الحدود والفواصل'],
  accent:['--accent','اللون الأساسي'],
  gold:['--gold','لون الاقتباس'],
  danger:['--danger','لون الحذف']
};
 
function defaultTheme(){
  return { mode:'auto', headFont:'Amiri', bodyFont:'IBM Plex Sans Arabic',
           fontSize:17, headScale:1, width:900, radius:14, colors:{} };
}
 
const PRESETS = [
  { name:'الافتراضي',   mode:'auto',  colors:{} },
  { name:'ليلي',        mode:'dark',  colors:{} },
  { name:'رملي دافئ',   mode:'light', colors:{ bg:'#F6F1E7', surface:'#FFFDF8', surface2:'#F0E9DB', ink:'#2B2620', inkSoft:'#6B6154', line:'#E4DBCA', accent:'#A2643C', gold:'#B8862F' } },
  { name:'أزرق ملكي',   mode:'light', colors:{ bg:'#EDF1F8', surface:'#FFFFFF', surface2:'#E6ECF7', ink:'#14233A', inkSoft:'#4C5D7A', line:'#D4DDEC', accent:'#2A4D8F', gold:'#C08A2E' } },
  { name:'زمردي ليلي',  mode:'dark',  colors:{ bg:'#0B1512', surface:'#122019', surface2:'#17291F', ink:'#E8F3EC', inkSoft:'#9FBCAD', line:'#22382C', accent:'#3FBF84', gold:'#D9AE5F' } },
  { name:'عنّابي',      mode:'light', colors:{ bg:'#FAF0F1', surface:'#FFFFFF', surface2:'#F5E4E7', ink:'#3A1E24', inkSoft:'#7A5A60', line:'#EBD3D7', accent:'#9B2C3F', gold:'#B8862F' } }
];
 
function loadFonts(list){
  const fams = [...new Set(list.filter(Boolean))]
    .map(f => 'family=' + f.replace(/ /g,'+') + ':wght@300;400;500;600;700');
  const href = 'https://fonts.googleapis.com/css2?' + fams.join('&') + '&display=swap';
  const link = document.getElementById('dynFonts');
  if(link && link.href !== href) link.href = href;
}
 
function stack(font){
  return '"' + font + '", ' + (SERIF_FONTS.includes(font) ? 'serif' : 'system-ui, "Segoe UI", sans-serif');
}
 
function applyTheme(t){
  const r = document.documentElement;
  if(!t) return;
  if(t.mode === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t.mode);
  r.style.setProperty('--font-head', stack(t.headFont));
  r.style.setProperty('--font-body', stack(t.bodyFont));
  r.style.setProperty('--fs', t.fontSize + 'px');
  r.style.setProperty('--hs', t.headScale);
  r.style.setProperty('--w', t.width + 'px');
  r.style.setProperty('--radius', t.radius + 'px');
  for(const k in VARS){
    const val = (t.colors||{})[k];
    if(val) r.style.setProperty(VARS[k][0], val); else r.style.removeProperty(VARS[k][0]);
  }
  if(t.colors && t.colors.accent){
    r.style.setProperty('--accent-soft', 'color-mix(in srgb, ' + t.colors.accent + ' 16%, transparent)');
  } else r.style.removeProperty('--accent-soft');
  loadFonts([t.headFont, t.bodyFont]);
}
 
/* ---- نافذة المظهر (معاينة فورية) ---- */
let themeBackup = null;
 
function cssNow(varName){
  const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  const m = v.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  return m ? v : '#888888';
}

        <button type="button" class="btn" data-act="th-mode" data-mode="auto"  aria-pressed="${t.mode==='auto'}">حسب الجهاز</button>
      </div></div>
 
    <div class="field"><label>ألوان الموقع</label>
      <div class="tgrid">${swatches}</div>
      <p class="hint">أي لون تلمسه يُثبَّت في الوضعين. لإرجاع كل الألوان للأصل:
        <button type="button" class="btn sm" data-act="th-reset-colors">إرجاع الألوان الافتراضية</button></p>

    <hr class="sep">
 
    <div class="field"><label for="th-head">خط العناوين</label>
      <select id="th-head" style="font-family:${stack(t.headFont)}">${fontOpts(t.headFont)}</select></div>

    <div class="field"><label for="th-fs">حجم النص</label>
      <div class="rng"><input type="range" id="th-fs" min="14" max="22" step="1" value="${t.fontSize}"><output id="o-fs">${t.fontSize}px</output></div></div>
    <div class="field"><label for="th-hs">حجم العناوين</label>
      <div class="rng"><input type="range" id="th-hs" min="0.7" max="1.4" step="0.05" value="${t.headScale}"><output id="o-hs">${Math.round(t.headScale*100)}%</output></div></div>
    <div class="field"><label for="th-w">عرض المحتوى</label>
      <div class="rng"><input type="range" id="th-w" min="700" max="1300" step="20" value="${t.width}"><output id="o-w">${t.width}px</output></div></div>
    <div class="field"><label for="th-r">استدارة الزوايا</label>
      <div class="rng"><input type="range" id="th-r" min="0" max="28" step="1" value="${t.radius}"><output id="o-r">${t.radius}px</output></div></div>
  `, `<button class="btn primary" data-act="modal-save">حفظ المظهر</button>
      <button class="btn ghost" data-act="close">إلغاء</button>`, ()=>{
    site.theme = readThemeForm();
    themeBackup = null;
    applyTheme(site.theme);
    commit();
  });
 
  const body = document.getElementById('mBody');
  body.addEventListener('input', e=>{
    if(e.target.dataset.ck) e.target.dataset.touched = '1';
    const d = readThemeForm();
    applyTheme(d);
    const o = { 'th-fs':['o-fs', v=>v+'px'], 'th-hs':['o-hs', v=>Math.round(v*100)+'%'],
                'th-w':['o-w', v=>v+'px'], 'th-r':['o-r', v=>v+'px'] }[e.target.id];
    if(o) document.getElementById(o[0]).textContent = o[1](e.target.value);
    if(e.target.id==='th-head') e.target.style.fontFamily = stack(e.target.value);
    if(e.target.id==='th-body') e.target.style.fontFamily = stack(e.target.value);

function readThemeForm(){
  const t = { mode: document.getElementById('th-mode').value,
              headFont: document.getElementById('th-head').value,
              bodyFont: document.getElementById('th-body').value,
              fontSize:+document.getElementById('th-fs').value,
              headScale:+document.getElementById('th-hs').value,
              width:+document.getElementById('th-w').value,
              radius:+document.getElementById('th-r').value,
              colors:{} };
  document.querySelectorAll('[data-ck]').forEach(i=>{ if(i.dataset.touched==='1') t.colors[i.dataset.ck] = i.value; });
  return t;
}
 
/* تحديث المنتقيات غير المعدّلة لتعرض ألوان النمط الحالي */
function refreshSwatches(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-ck]').forEach(i=>{
      if(i.dataset.touched !== '1') i.value = cssNow(VARS[i.dataset.ck][0]);
    });

}

/* =======================================================================
   3) طبقة حفظ البيانات (ثلاث خلفيات: Claude / Supabase / التخزين المحلي)
   ======================================================================= */
const LS_KEY = 'site_content_v1';
 
const Store = {
  mode:'local', db:null, sb:null, ready:false,
 
  async init(onRemote){
    // نسخة محليّة فورية حتى لا تبقى الصفحة فارغة
    try{ const c=localStorage.getItem(LS_KEY); if(c) site = JSON.parse(c); }catch(e){}
 
    if(CONFIG.SUPABASE.enabled){
      try{
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
        this.sb = window.supabase.createClient(CONFIG.SUPABASE.url, CONFIG.SUPABASE.anonKey);
        const { data, error } = await this.sb.from(CONFIG.SUPABASE.table).select('data').eq('id', CONFIG.SUPABASE.rowId).maybeSingle();
        if(error) throw error;
        this.mode='supabase'; this.ready=true;
        if(data && data.data){ site = typeof data.data==='string' ? JSON.parse(data.data) : data.data; onRemote(); }
        setStatus('متصل بـ Supabase');
 
        // بث لحظي: أي حفظ من أي زائر آخر يظهر فوراً عند كل من فاتح الصفحة
        this.sb.channel('site_content_live')
          .on('postgres_changes', { event:'*', schema:'public', table:CONFIG.SUPABASE.table, filter:`id=eq.${CONFIG.SUPABASE.rowId}` },
            payload => {
              if(this._justSaved){ this._justSaved=false; return; } // تجاهل الصدى من حفظنا نحن
              if(document.querySelector('.overlay.open')) return;    // لا نقاطع تعديلاً جارياً
              const incoming = payload.new && payload.new.data;
              if(incoming){ site = typeof incoming==='string' ? JSON.parse(incoming) : incoming; onRemote(); toast('تحديث جديد من مصدر آخر'); }
            })
          .subscribe();
        return;
      }catch(e){ console.warn('Supabase غير متاح:', e); setStatus('تعذّر الاتصال بـ Supabase — حفظ محلي'); }
    }
 
    // خلفية claude.ai عند نشر الصفحة كـ Artifact
    try{
      if(window.claude && typeof window.claude.use==='function'){
        const db = await window.claude.use('db');
        if(db){
          this.db = db.doc('site/content'); this.mode='claude'; this.ready=true;
          const snap = await this.db.get();
          if(snap.exists && snap.data() && snap.data().json){ site = JSON.parse(snap.data().json); onRemote(); }
          this.db.onSnapshot(s=>{
            if(!s.exists || !s.data() || !s.data().json) return;
            if(document.querySelector('.overlay.open')) return; // لا نقاطع تعديلاً جارياً
            const incoming = s.data().json;
            if(incoming !== JSON.stringify(site)){ site = JSON.parse(incoming); onRemote(); }
          }, ()=>{});
          setStatus('الحفظ سحابي'); return;
        }
      }
    }catch(e){ console.warn(e); }
 
    this.mode='local'; this.ready=true; setStatus('حفظ محلي في هذا المتصفح');
  },
 
  async save(){
    const json = JSON.stringify(site);
    try{ localStorage.setItem(LS_KEY, json); }catch(e){}
    if(this.mode==='supabase'){
      this._justSaved = true;
      const { error } = await this.sb.from(CONFIG.SUPABASE.table)
        .upsert({ id: CONFIG.SUPABASE.rowId, data: site, updated_at: new Date().toISOString() });
      if(error){ this._justSaved=false; throw error; }
    } else if(this.mode==='claude' && this.db){
      await this.db.set({ json, updatedAt: new Date().toISOString() });
    }
  }
};
 
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}
 
let saveTimer=null, saving=false;
function scheduleSave(){
  clearTimeout(saveTimer);
  setStatus('يحفظ…');
  saveTimer = setTimeout(async ()=>{
    if(saving){ scheduleSave(); return; }
    saving=true;
    try{ await Store.save(); setStatus('تم الحفظ ✓'); }
    catch(e){ console.error(e); setStatus('تعذّر الحفظ'); toast('لم يُحفظ التعديل على الخادم'); }
    finally{ saving=false; }
  }, 700);
}

function renderBlock(b, secId, j, last){
  const tools = `
    <div class="block-tools">
      <button class="btn sm" data-act="blk-up" data-sec="${secId}" data-id="${b.id}" ${j===0?'disabled':''}>▲</button>
      <button class="btn sm" data-act="blk-down" data-sec="${secId}" data-id="${b.id}" ${j===last?'disabled':''}>▼</button>
      <button class="btn sm" data-act="blk-edit" data-sec="${secId}" data-id="${b.id}">تعديل</button>
      <button class="btn sm danger" data-act="blk-del" data-sec="${secId}" data-id="${b.id}">حذف</button>
    </div>`;
  let body='';
  if(b.type==='text'){
    if(b.style==='heading')      body = `<h3 class="b-h">${esc(b.text)}</h3>`;
    else if(b.style==='quote')   body = `<blockquote class="b-quote">${fmt(b.text)}</blockquote>`;
    else if(b.style==='note')    body = `<div class="b-note">${fmt(b.text)}</div>`;
    else                         body = `<div class="b-p">${fmt(b.text)}</div>`;
  }
  else if(b.type==='image'){
    body = `<figure><img src="${esc(b.url)}" alt="${esc(b.caption||'')}" loading="lazy">
      ${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;
  }
  else if(b.type==='video'){
    body = `<figure><div class="video-box">${videoEmbed(b.url)}</div>
      ${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;
  }
  else if(b.type==='links'){
    body = `<ul class="linklist">${(b.items||[]).map(it=>`
      <li><a class="linkbtn" href="${esc(it.url)}" target="_blank" rel="noopener">
        <b>${esc(it.label)}</b>${it.desc?`<span>${esc(it.desc)}</span>`:''}</a></li>`).join('')}</ul>`;
  }
  return `<div class="block" data-id="${b.id}">${tools}${body}</div>`;
}

  else if(b.type==='video'){
    body = `
      <div class="field"><label for="bu">رابط الفيديو</label><input id="bu" value="${esc(b.url)}" placeholder="https://www.youtube.com/watch?v=…">
        <p class="hint">يدعم يوتيوب، فيميو، وأي رابط mp4 مباشر.</p></div>
      <div class="field"><label for="bc">تعليق (اختياري)</label><input id="bc" value="${esc(b.caption||'')}"></div>`;
  }
  else if(b.type==='links'){
    body = `<div class="field"><label>الروابط</label><div id="links">${
      (b.items||[]).map(it=>linkRow(it)).join('')
    }</div><button class="btn sm" data-act="add-link" type="button">＋ رابط آخر</button></div>`;
  }
  openModal(isNew?'إضافة محتوى':'تعديل المحتوى', body, footSave(), ()=>{
    if(b.type==='text'){ b.style=$('#bs').value; b.text=$('#bt').value; if(!b.text.trim()){toast('اكتب النص');return false;} }
    if(b.type==='image'||b.type==='video'){
      b.url=$('#bu').value.trim(); b.caption=$('#bc').value.trim();
      if(!b.url){ toast('أضف رابطاً أولاً'); return false; }
    }
    if(b.type==='links'){
      b.items=[...document.querySelectorAll('#links .linkrow')].map(r=>({
        label:r.children[0].value.trim(), url:r.children[1].value.trim(), desc:r.children[2].value.trim()
      })).filter(x=>x.label && x.url);
      if(!b.items.length){ toast('أضف رابطاً واحداً على الأقل'); return false; }
    }
    if(isNew) sec.blocks.push(b);
    commit();
  });
 
  const file = $('#bf');
  if(file) file.addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size > 1.5*1024*1024){ toast('الصورة كبيرة جداً — استخدم رابطاً مباشراً'); return; }
    const r=new FileReader(); r.onload=()=>{ $('#bu').value=r.result; toast('تم تحميل الصورة'); }; r.readAsDataURL(f);
  });
}
function linkRow(it){
  it = it||{label:'',url:'',desc:''};
  return `<div class="linkrow">
    <input value="${esc(it.label)}" placeholder="اسم الرابط">
    <input value="${esc(it.url)}" placeholder="https://">
    <input value="${esc(it.desc||'')}" placeholder="وصف قصير">
    <button class="btn sm danger" data-act="del-link" type="button">✕</button></div>`;
}
 
/* ---- إعدادات الموقع ---- */
function settingsModal(){
  openModal('إعدادات الموقع', `
    <div class="field"><label for="g1">اسم الموقع (أعلى الصفحة)</label><input id="g1" value="${esc(site.meta.title)}"></div>
    <div class="field"><label for="g2">العنوان الرئيسي</label><input id="g2" value="${esc(site.meta.heroTitle)}"></div>
    <div class="field"><label for="g3">النص التعريفي</label><textarea id="g3" style="min-height:90px">${esc(site.meta.heroSub)}</textarea></div>
    <div class="field"><label for="g4">رابط صورة الغلاف (اختياري)</label><input id="g4" value="${esc(site.meta.cover||'')}"></div>
    <div class="field"><label for="g5">نص التذييل</label><input id="g5" value="${esc(site.meta.footer||'')}"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
    <div class="field"><label for="p1">كلمة مرور جديدة (اتركها فارغة لعدم التغيير)</label><input type="password" id="p1" autocomplete="new-password"></div>
    <div class="field"><label for="p2">تأكيد كلمة المرور</label><input type="password" id="p2" autocomplete="new-password"></div>
  `, footSave(), async ()=>{
    site.meta.title=$('#g1').value.trim(); site.meta.heroTitle=$('#g2').value.trim();
    site.meta.heroSub=$('#g3').value.trim(); site.meta.cover=$('#g4').value.trim();
    site.meta.footer=$('#g5').value.trim();
    const p1=$('#p1').value, p2=$('#p2').value;
    if(p1){
      if(p1.length<6){ toast('كلمة المرور قصيرة (6 أحرف فأكثر)'); return false; }
      if(p1!==p2){ toast('كلمتا المرور غير متطابقتين'); return false; }
      site.auth.passHash = await hashPass(p1); toast('تم تغيير كلمة المرور');
    }
    commit();
  });
}
 
/* =======================================================================
   6) الأحداث
   ======================================================================= */
function commit(){ render(); scheduleSave(); closeModal(); }
function findSec(id){ return site.sections.find(s=>s.id===id); }
function move(arr, id, dir){
  const i = arr.findIndex(x=>x.id===id), j = i+dir;
  if(i<0 || j<0 || j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
}
 
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act, id = t.dataset.id, secId = t.dataset.sec;
 
  if(act==='close'){ closeModal(); return; }
  if(act==='modal-save'){ if(onSaveModal) await onSaveModal(); return; }
  if(act==='pick-type'){ blockModal(secId, null, t.dataset.type); return; }
  if(act==='add-link'){ $('#links').insertAdjacentHTML('beforeend', linkRow()); return; }
  if(act==='del-link'){ t.parentElement.remove(); return; }
 
  if(!isAdmin) return; // كل ما تحت هذا السطر للمحرّر فقط
 
  switch(act){
    case 'add-section': sectionModal(null); break;
    case 'sec-edit':    sectionModal(findSec(id)); break;
    case 'sec-del':
      if(confirm('حذف هذا القسم بكل محتواه؟')){ site.sections = site.sections.filter(s=>s.id!==id); commit(); }
      break;
    case 'sec-up':   move(site.sections,id,-1); commit(); break;
    case 'sec-down': move(site.sections,id, 1); commit(); break;
    case 'add-block': chooseType(secId); break;
    case 'blk-edit': blockModal(secId, findSec(secId).blocks.find(b=>b.id===id)); break;
    case 'blk-del':
      if(confirm('حذف هذا المحتوى؟')){ const s=findSec(secId); s.blocks=s.blocks.filter(b=>b.id!==id); commit(); }
      break;
    case 'blk-up':   move(findSec(secId).blocks,id,-1); commit(); break;
    case 'blk-down': move(findSec(secId).blocks,id, 1); commit(); break;
    case 'settings': settingsModal(); break;
    case 'theme': themeModal(); break;
    case 'th-mode': {
      document.getElementById('th-mode').value = t.dataset.mode;
      document.querySelectorAll('[data-act="th-mode"]').forEach(b=>b.setAttribute('aria-pressed', b===t));
      applyTheme(readThemeForm()); refreshSwatches(); break;
    }
    case 'th-reset-colors':
      document.querySelectorAll('[data-ck]').forEach(i=>i.dataset.touched='0');
      applyTheme(readThemeForm()); refreshSwatches(); toast('رجعت الألوان الافتراضية'); break;
    case 'th-preset': {
      const p = PRESETS[+t.dataset.i];
      const cur = readThemeForm();
      themeModal(Object.assign(cur, { mode:p.mode, colors: clone(p.colors) }));
      break;
    }
    case 'logout':
      isAdmin=false; document.body.classList.remove('admin'); $('#fab').textContent='🔒'; toast('تم الخروج من وضع التحرير'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(site,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download='site-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
      URL.revokeObjectURL(a.href); break;
    }
    case 'import': $('#fileInput').click(); break;
  }
});
 
$('#fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.sections) throw 0;
      const keep = site.auth;            // نحتفظ بكلمة المرور الحالية
      site = d; site.auth = d.auth && d.auth.passHash ? d.auth : keep;
      commit(); toast('تم الاستيراد');
    }catch(err){ toast('الملف غير صالح'); } };
  r.readAsText(f); e.target.value='';
});
 
$('#fab').addEventListener('click', ()=>{
  if(isAdmin){ isAdmin=false; document.body.classList.remove('admin'); $('#fab').textContent='🔒'; toast('تم الخروج'); }
  else askPassword();
});
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && $('#overlay').classList.contains('open') && e.target.tagName!=='TEXTAREA' && onSaveModal){ e.preventDefault(); onSaveModal(); }
});
 
/* =======================================================================
   7) الإقلاع
   ======================================================================= */
(async function start(){
  render();
  await Store.init(render);
  render();
  if(!site.auth.passHash){ site.auth.passHash = await hashPass(CONFIG.DEFAULT_PASSWORD); }
})();
</script>
</body>
